<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقارنة أسماء PDF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f9;color:#1d2939;font-family:Arial,Tahoma,sans-serif}
    .app{max-width:1100px;margin:auto;padding:20px}
    .hero{background:linear-gradient(135deg,#0f766e,#15803d);color:white;border-radius:22px;padding:25px;margin-bottom:18px}
    h1{margin:0 0 8px;font-size:30px}
    .hero p{margin:0;opacity:.92;line-height:1.7}
    .badge{display:inline-block;margin-top:15px;background:#ffffff22;padding:8px 13px;border-radius:30px}
    .upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .upload-card{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 18px #0000000b;cursor:pointer}
    .upload-card strong{display:block;font-size:18px;margin:8px 0}
    .icon{font-size:32px}
    input[type=file]{width:100%;margin:12px 0}
    .file-name{display:block;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:10px;margin:18px 0}
    button{border:0;border-radius:13px;padding:14px 24px;font-size:17px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.55}
    .primary{background:#16835f;color:white;flex:1}
    .secondary{background:#e4e7ec;color:#344054}
    .progress-box{background:white;padding:15px;border-radius:16px;margin:15px 0}
    .progress{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:10px}
    #progressBar{height:100%;width:0;background:#16835f;transition:width .2s}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:18px 0}
    .stat{background:white;border-radius:18px;padding:20px;text-align:center;box-shadow:0 5px 18px #0000000b}
    .stat b{display:block;font-size:35px;color:#16835f}
    .stat.removed b{color:#c0392b}
    .stat span{color:#667085;font-size:16px}
    .results{background:white;border-radius:20px;padding:18px}
    .toolbar{display:flex;gap:10px;margin-bottom:18px}
    #searchInput{flex:1;padding:14px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}
    .columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .panel{border-radius:16px;overflow:hidden;border:1px solid #e4e7ec}
    .panel h2{margin:0;padding:16px;color:white;font-size:20px}
    .added-panel h2{background:#16835f}
    .removed-panel h2{background:#c0392b}
    .list{padding:10px}
    .name-row{display:flex;gap:12px;align-items:center;padding:13px 10px;border-bottom:1px solid #eef0f3}
    .name-row:last-child{border-bottom:0}
    .number{min-width:32px;height:32px;border-radius:50%;background:#eef2f6;display:flex;align-items:center;justify-content:center;font-weight:bold}
    .name-content strong{display:block;font-size:16px}
    .name-content small{display:block;color:#667085;margin-top:4px}
    .empty{text-align:center;padding:30px;color:#98a2b3}
    .message{padding:14px;text-align:center;color:#475467}
    footer{text-align:center;color:#98a2b3;padding:20px}
    .hidden{display:none!important}
    @media(max-width:700px){
      .app{padding:12px}
      .upload-grid,.columns{grid-template-columns:1fr}
      .summary{grid-template-columns:1fr 1fr}
      .toolbar{display:block}
      #searchInput{width:100%;margin-bottom:10px}
      h1{font-size:25px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>مقارنة أسماء PDF</h1>
    <p>يعرض لك فقط الأسماء الجديدة المضافة والأسماء المحذوفة بين الملفين.</p>
    <div class="badge">المقارنة حسب رقم البطاقة القديم</div>
  </header>

  <section class="upload-grid">
    <label class="upload-card">
      <span class="icon">📄</span>
      <strong>الملف القديم</strong>
      <input id="oldFile" type="file" accept=".pdf,application/pdf">
      <span id="oldName" class="file-name">لم يتم اختيار ملف</span>
    </label>

    <label class="upload-card">
      <span class="icon">📄</span>
      <strong>الملف الجديد</strong>
      <input id="newFile" type="file" accept=".pdf,application/pdf">
      <span id="newName" class="file-name">لم يتم اختيار ملف</span>
    </label>
  </section>

  <div class="actions">
    <button id="compareBtn" class="primary">🔎 إظهار فروقات الأسماء</button>
    <button id="clearBtn" class="secondary">مسح</button>
  </div>

  <div id="progressBox" class="progress-box hidden">
    <div id="progressText">جاري القراءة...</div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <section id="resultsSection" class="results hidden">
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="ابحث عن اسم أو رقم البطاقة القديم...">
    </div>

    <div class="summary">
      <div class="stat">
        <b id="addedCount">0</b>
        <span>أسماء جديدة مضافة</span>
      </div>
      <div class="stat removed">
        <b id="removedCount">0</b>
        <span>أسماء محذوفة</span>
      </div>
    </div>

    <div class="columns">
      <div class="panel added-panel">
        <h2>🟢 الأسماء الجديدة المضافة</h2>
        <div id="addedList" class="list"></div>
      </div>

      <div class="panel removed-panel">
        <h2>🔴 الأسماء المحذوفة</h2>
        <div id="removedList" class="list"></div>
      </div>
    </div>
  </section>

  <div id="message" class="message"></div>

  <footer>
    تتم معالجة ملفات PDF داخل المتصفح.
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
